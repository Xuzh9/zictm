_schema-version: 3.3.0
ID: zictm
version: 1.0.0
description: "zictm"
parameters:
  enable-parallel-deployments: true
build-parameters:
  # before-all:
  #   - builder: custom
  #     commands:
  #       - npm install
  #       - npm run build
modules:
  - name: zictm-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      command: node node_modules/@sap/cds-dk/bin/cds.js run
      disk-quota: 2048M
      memory: 256M
      routes:
      - route: "zictm-srv.btp.sunlu3d.cn"
      idle-routes:
      - idle-route: "zictm-srv-idle.btp.sunlu3d.cn"
    # build-parameters:
    #   builder: npm install
    provides:
      - name: srv-api
        properties:
          srv-url: https://zictm-srv.btp.sunlu3d.cn
    requires:
      - name: zictm-auth
      - name: zictm-db
      - name: zictm-destination

  - name: zictm-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: zictm-db
    properties:
      HDI_DEPLOY_OPTIONS: '{"auto_undeploy": false}'
      
  - name: zictm
    type: approuter.nodejs
    path: app/router
    parameters:
      buildpack: nodejs_buildpack
      keep-existing-routes: true
      disk-quota: 2048M
      memory: 256M
      routes:
      - route: "zictm.btp.sunlu3d.cn"
      idle-routes:
      - idle-route: "zictm-idle.btp.sunlu3d.cn"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: false
      - name: zictm-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: zictm-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      
  - name: zictm-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      
  - name: zictm-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite